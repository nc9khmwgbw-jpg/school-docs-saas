name: CI / Automated Quality & Security Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    name: PHPUnit & Security Hardening Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: saas_documents
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_USER: saas_user
          MYSQL_PASSWORD: saas_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=db/DB_HOST=127.0.0.1/g' .env
          sed -i 's/REDIS_HOST=redis/REDIS_HOST=127.0.0.1/g' .env
          php artisan key:generate

      - name: Prepare Storage Directories & Permissions
        run: |
          mkdir -p storage/app/private/documents
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          chmod -R 777 storage bootstrap/cache

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Seeders (Admin & Demo Fixtures)
        run: php artisan db:seed --force

      - name: Execute PHPUnit Test Suite (45 tests)
        run: php vendor/bin/phpunit --colors=always

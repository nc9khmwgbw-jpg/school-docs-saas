services:
  # 1. Serveur Web Nginx (HTTPS & Reverse Proxy)
  web:
    image: nginx:alpine
    container_name: saas_school_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - app
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. Back-end PHP 8.3 FPM
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_school_app
    restart: always
    volumes:
      - .:/var/www/html
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache-recommended.ini:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saas_documents}
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=predis
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-DocScolaire SaaS}
    networks:
      - saas_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 3. Base de Données MySQL 8.0 (Isolée d'Internet)
  db:
    image: mysql:8.0
    container_name: saas_school_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=512M --max-connections=150
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-saas_documents}
      MYSQL_USER: ${DB_USERNAME:-saas_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USERNAME:-saas_user}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Redis (Cache, Sessions & Queue)
  redis:
    image: redis:7-alpine
    container_name: saas_school_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 5. Worker Asynchrone (Supervisor pour génération des PDF et notifications)
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_school_worker
    restart: always
    command: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
    volumes:
      - .:/var/www/html
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saas_documents}
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=predis
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-DocScolaire SaaS}
    networks:
      - saas_network
    depends_on:
      - db
      - redis
      - app

  # 6. Cron / Scheduler Laravel (Expirations, audits et tâches récurrentes)
  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_school_cron
    restart: always
    command: sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saas_documents}
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - saas_network
    depends_on:
      - db
      - redis
      - app

  # 7. Certbot (Renouvellement automatique SSL Let's Encrypt tous les 12h)
  certbot:
    image: certbot/certbot:latest
    container_name: saas_school_certbot
    restart: always
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - saas_network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local

networks:
  saas_network:
    driver: bridge
